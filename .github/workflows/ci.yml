name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Type-check, unit and screen tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type-check, test and build every package
        run: npx turbo run typecheck test build
      - name: Production settings template is complete and valid
        run: npm run config:check -- ../../.env.production.example --template

  e2e:
    name: End to end (API, Postgres, demos, SMTP)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: development
      PORT: 4000
      PUBLIC_BASE_URL: http://localhost:4000
      WEB_BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://vat_app:vat_app_dev@localhost:5432/vat_assist
      DATABASE_OWNER_URL: postgres://vat_owner:vat_owner_dev@localhost:5432/vat_assist
      OTP_PROVIDER: dev
      OTP_DEV_FIXED_CODE: "000000"
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /tmp/vat-storage
      EXTRACTION_PROVIDER: mock
      PAYMENTS_MODE: mock
      MESSAGING_PROVIDER: console
      MAIL_PROVIDER: console
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the API
        run: npx turbo run build --filter=@vat-assist/api
      - name: Secrets for this run only
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Database, roles, migrations (twice, to prove they apply once) and seed
        run: |
          psql -h localhost -U postgres -c 'create database vat_assist'
          psql -h localhost -U postgres -d vat_assist -v ON_ERROR_STOP=1 -f infra/db/00-roles.sql
          psql -h localhost -U postgres -d vat_assist -c 'alter schema public owner to vat_owner'
          npm run db:migrate
          npm run db:migrate
          npm run db:seed
      - name: Production bootstrap works on an empty database
        run: |
          psql -h localhost -U postgres -c 'create database vat_bootstrap'
          psql -h localhost -U postgres -c 'alter database vat_bootstrap owner to vat_owner'
          psql -h localhost -U postgres -d vat_bootstrap -c 'alter schema public owner to vat_owner'
          DATABASE_OWNER_URL=postgres://vat_owner:vat_owner_dev@localhost:5432/vat_bootstrap npm run db:migrate
          out=$(DATABASE_OWNER_URL=postgres://vat_owner:vat_owner_dev@localhost:5432/vat_bootstrap \
                npm run bootstrap -- --platform-name "Nex-Gen Africa Ltd" --admin-email admin@nexgen.test --admin-name "CI Admin")
          grep -q "Created the platform organisation" <<< "$out"
          grep -q "/invite/" <<< "$out"
      - name: Start the API
        run: |
          nohup node packages/api/dist/main.js > api.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf localhost:4000/health && exit 0; sleep 1; done
          cat api.log
          exit 1
      - name: The 18-step demo
        run: npm run demo | tee demo-run.txt
      - name: The pitch demo
        run: npm run demo:pitch | tee demo-pitch.txt
      - name: End-to-end suites
        run: npm run test:e2e
      - name: Invite flow over real SMTP (second API instance, cPanel-style settings)
        env:
          PORT: 4001
          MAIL_PROVIDER: smtp
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: 2525
          SMTP_TLS: none
          SMTP_USER: connect@nex-gen.africa
          SMTP_PASS: ci-smtp-pass
          MAIL_FROM: Nex-Gen Africa <connect@nex-gen.africa>
        run: |
          nohup node packages/api/dist/main.js > api-smtp.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf localhost:4001/health && break; sleep 1; done
          E2E_API_URL=http://localhost:4001 E2E_SMTP_SINK_PORT=2525 E2E_SMTP_USER=connect@nex-gen.africa \
            E2E_SMTP_PASS=ci-smtp-pass npm run test:e2e:smtp
      - name: Keep logs and demo outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}
          path: |
            api.log
            api-smtp.log
            demo-run.txt
            demo-pitch.txt
            packages/api/demo-output/*.pdf
          if-no-files-found: ignore
